# Default values for excalidraw.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# The container image used for this helm chart uses a nonroot, unprivileged nginx base image
image:
  repository: ghcr.io/jmpiraino97/excalidraw
  # This sets the pull policy for images.
  pullPolicy: Always
resources: []
# Setting security context at the pod level
podSecurityContext:
   runAsNonRoot:
   runAsUser:
   fsGroup:
# Setting security context at the container level
securityContext: []

# Setting the service for Excalidraw. By default, the helm chart has ContainerPort set to 8080
service:
  type: ClusterIP
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className:
  annotations: []

  hosts:
    - host:
      paths:
        - path: /
          pathType: Prefix
  tls:
   enabled: true
   secretName:
  
